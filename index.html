<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Cloud AI Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 12px; background: #f4f6f8; }
    #setup { display: flex; gap: 8px; margin: 10px 0; }
    #setup input { padding: 8px; }
    #key { flex: 1; }
    #chat { background: #fff; border: 1px solid #ccc; border-radius: 8px; height: 380px; overflow-y: auto; padding: 10px; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
    .user { background: #d0e8ff; margin-left: auto; }
    .bot { background: #eee; }
    #inputRow { display: flex; gap: 8px; margin-top: 10px; }
    #msg { flex: 1; padding: 10px; }
    button { padding: 10px 16px; cursor: pointer; }
  </style>
</head>
<body>
    <h1>🤖 Hello Pakistan! My Cloud AI Chatbot</h1>
  <p>Deployed with GitHub Actions + GitHub Pages. Powered by the Google Gemini API.</p>

  <div id="setup">
    <input id="key" type="password" placeholder="Paste your Gemini API key (stays in your browser only)">
    <input id="model" value="gemini-3.5-flash-lite">
  </div>

  <div id="chat"></div>

  <div id="inputRow">
    <input id="msg" placeholder="Type your message...">
    <button id="send">Send</button>
  </div>

  <script>
    const history = [];
    const chat = document.getElementById("chat");
    const msgBox = document.getElementById("msg");
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function add(text, cls) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    async function send() {
      const key = document.getElementById("key").value.trim();
      const model = document.getElementById("model").value.trim();
      const text = msgBox.value.trim();
      if (!text) return;
      if (!key) { add("Please paste your API key first.", "bot"); return; }

      add(text, "user");
      msgBox.value = "";
      history.push({ role: "user", parts: [{ text }] });
      const wait = add("Thinking...", "bot");

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
      let reply = "Server is busy. Please try again later.";
      let ok = false;

      for (let i = 0; i < 3; i++) {
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-goog-api-key": key },
            body: JSON.stringify({ contents: history })
          });
          const data = await res.json();
          if (res.ok) {
            reply = data.candidates[0].content.parts.map(p => p.text || "").join("");
            history.push({ role: "model", parts: [{ text: reply }] });
            ok = true;
            break;
          }
          if (res.status === 503 || res.status === 429) {
            wait.textContent = `Server busy, retrying (${i + 1}/3)...`;
            await sleep(5000);
            continue;
          }
          reply = "Error: " + (data.error ? data.error.message : res.status);
          break;
        } catch (e) {
          reply = "Error: " + e.message;
          break;
        }
      }
      if (!ok) history.pop();
      wait.textContent = reply;
    }

    document.getElementById("send").onclick = send;
    msgBox.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
